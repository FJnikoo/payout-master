<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Payout Master | Limitless</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    :root {
      --lime: #c8ff00;
      --lime-dim: #9acc00;
      --bg: #05070a;
      --card: #0c1017;
      --text: #f0f4f8;
      --muted: #8b9bb0;
      --border: rgba(200, 255, 0, 0.15);
      --danger: #ff4d4d;
      --ok: #c8ff00;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100dvh;
      overflow-x: hidden;
    }

    .screen {
      display: none;
      min-height: 100dvh;
      padding: 24px 20px 40px;
      max-width: 480px;
      margin: 0 auto;
      position: relative;
    }
    .screen.active { display: flex; flex-direction: column; }

    /* ===== ENTRY ===== */
    #entry {
      justify-content: center;
      gap: 28px;
    }

    .logo-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-bottom: 8px;
    }

    .logo-mark {
      width: 56px;
      height: 56px;
      background: var(--lime);
      border-radius: 12px;
      display: grid;
      place-items: center;
      overflow: hidden;
      box-shadow: 0 0 24px rgba(200, 255, 0, 0.25);
    }
    .logo-mark img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    h1 {
      font-size: 28px;
      font-weight: 900;
      letter-spacing: -0.5px;
      text-align: center;
      line-height: 1.15;
    }
    h1 span { color: var(--lime); }

    .subtitle {
      text-align: center;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.5;
      margin-top: -12px;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .field label {
      font-size: 12px;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.6px;
    }

    .avatar-upload {
      width: 96px;
      height: 96px;
      border-radius: 50%;
      border: 2px dashed var(--border);
      background: var(--card);
      display: grid;
      place-items: center;
      cursor: pointer;
      overflow: hidden;
      margin: 0 auto;
      position: relative;
      transition: border-color 0.2s;
    }
    .avatar-upload:hover { border-color: var(--lime); }
    .avatar-upload img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .avatar-upload .placeholder {
      color: var(--muted);
      font-size: 12px;
      text-align: center;
      padding: 8px;
    }
    .avatar-upload input { display: none; }

    input[type="text"] {
      width: 100%;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px 16px;
      color: var(--text);
      font-size: 16px;
      outline: none;
      transition: border-color 0.2s;
    }
    input[type="text"]:focus { border-color: var(--lime); }
    input[type="text"]::placeholder { color: #4a5568; }

    .btn {
      width: 100%;
      border: none;
      border-radius: 14px;
      padding: 16px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.15s, opacity 0.15s;
      font-family: inherit;
    }
    .btn:active { transform: scale(0.98); }
    .btn-primary {
      background: var(--lime);
      color: #0a0c00;
    }
    .btn-primary:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }
    .btn-ghost {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text);
    }
    .btn-share {
      background: #1d9bf0;
      color: #fff;
    }

    .hint {
      font-size: 12px;
      color: var(--muted);
      text-align: center;
    }

    /* ===== GAME ===== */
    #game {
      gap: 20px;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      color: var(--muted);
    }
    .topbar strong { color: var(--lime); }

    .timer-bar {
      height: 4px;
      background: rgba(255,255,255,0.08);
      border-radius: 2px;
      overflow: hidden;
    }
    .timer-fill {
      height: 100%;
      background: var(--lime);
      width: 100%;
      transition: width 0.1s linear;
    }
    .timer-fill.urgent { background: var(--danger); }

    .market-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 18px;
    }
    .market-title {
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 14px;
      text-align: center;
    }
    .sides {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      gap: 10px;
      align-items: center;
    }
    .side {
      text-align: center;
    }
    .side-name {
      font-weight: 700;
      font-size: 15px;
      margin-bottom: 6px;
    }
    .side-meta {
      font-size: 13px;
      font-weight: 600;
    }
    .side.left .side-meta { color: #ff8a4c; }
    .side.right .side-meta { color: #5b9dff; }
    .vs {
      font-size: 11px;
      color: var(--muted);
      font-weight: 600;
    }
    .prob-bar {
      height: 6px;
      border-radius: 3px;
      background: #5b9dff;
      margin-top: 14px;
      overflow: hidden;
      display: flex;
    }
    .prob-bar .left-fill {
      background: #ff8a4c;
      height: 100%;
    }

    .question {
      font-size: 17px;
      font-weight: 600;
      text-align: center;
      line-height: 1.4;
      padding: 0 4px;
    }
    .question em {
      color: var(--lime);
      font-style: normal;
    }

    .options {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .option {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      font-size: 18px;
      font-weight: 700;
      color: var(--text);
      cursor: pointer;
      text-align: center;
      transition: border-color 0.15s, background 0.15s;
    }
    .option:hover { border-color: var(--lime); }
    .option.correct {
      border-color: var(--ok);
      background: rgba(200, 255, 0, 0.12);
      color: var(--ok);
    }
    .option.wrong {
      border-color: var(--danger);
      background: rgba(255, 77, 77, 0.12);
      color: var(--danger);
    }
    .option:disabled { cursor: default; pointer-events: none; }

    .feedback {
      text-align: center;
      font-size: 13px;
      color: var(--muted);
      min-height: 40px;
      line-height: 1.4;
    }
    .feedback strong { color: var(--lime); }

    /* ===== RESULT ===== */
    #result {
      gap: 20px;
      align-items: center;
    }

    .result-title {
      font-size: 22px;
      font-weight: 800;
      text-align: center;
    }
    .result-title span { color: var(--lime); }

    .card-preview {
      width: 100%;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 0 40px rgba(200, 255, 0, 0.12);
      border: 1px solid var(--border);
    }
    .card-preview canvas {
      width: 100%;
      display: block;
    }

    .actions {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .footer-credit {
      font-size: 11px;
      color: var(--muted);
      text-align: center;
      margin-top: auto;
      padding-top: 20px;
    }
    .footer-credit a { color: var(--lime); text-decoration: none; }

    /* Loading overlay while drawing card */
    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(5,7,10,0.85);
      display: none;
      place-items: center;
      z-index: 50;
      color: var(--lime);
      font-weight: 600;
    }
    .overlay.show { display: grid; }
  </style>
</head>
<body>
  <div class="overlay" id="overlay">Generating your card…</div>

  <!-- ========== ENTRY ========== -->
  <div class="screen active" id="entry">
    <div class="logo-row">
      <div class="logo-mark">
        <img id="entryLogo" alt="Limitless" />
      </div>
    </div>
    <h1>PAYOUT<br><span>MASTER</span></h1>
    <p class="subtitle">
      Learn how prediction market payouts work on Limitless.<br>
      Answer correctly → unlock your shareable card.
    </p>

    <div class="field">
      <label>Profile photo</label>
      <div class="avatar-upload" id="avatarBox" onclick="document.getElementById('avatarInput').click()">
        <div class="placeholder" id="avatarPlaceholder">Tap to<br>upload</div>
        <img id="avatarPreview" style="display:none" alt="avatar" />
        <input type="file" id="avatarInput" accept="image/*" />
      </div>
    </div>

    <div class="field">
      <label>X / Twitter handle</label>
      <input type="text" id="handleInput" placeholder="@FJnikoo" autocomplete="off" spellcheck="false" />
    </div>

    <div class="field">
      <label>Display name <span style="text-transform:none;font-weight:500;opacity:.7">(shown on card)</span></label>
      <input type="text" id="nameInput" placeholder="FJ" autocomplete="off" spellcheck="false" />
    </div>

    <button class="btn btn-primary" id="startBtn" disabled>Start Game</button>
    <p class="hint">5 quick rounds · ~1 minute</p>
  </div>

  <!-- ========== GAME ========== -->
  <div class="screen" id="game">
    <div class="topbar">
      <div>Round <strong id="roundNum">1</strong> / 5</div>
      <div>Score <strong id="scoreNum">0</strong></div>
    </div>
    <div class="timer-bar"><div class="timer-fill" id="timerFill"></div></div>

    <div class="market-card" id="marketCard">
      <!-- filled by JS -->
    </div>

    <p class="question" id="questionText"></p>

    <div class="options" id="options"></div>

    <div class="feedback" id="feedback"></div>
  </div>

  <!-- ========== RESULT ========== -->
  <div class="screen" id="result">
    <p class="result-title">You are <span>Limitless</span> now</p>
    <div class="card-preview">
      <canvas id="cardCanvas" width="1200" height="675"></canvas>
    </div>
    <div class="actions">
      <button class="btn btn-primary" id="downloadBtn">Download Card</button>
      <button class="btn btn-share" id="shareBtn">Share on X</button>
      <button class="btn btn-ghost" id="replayBtn">Play Again</button>
    </div>
    <p class="footer-credit">Built for <a href="https://limitless.exchange" target="_blank">Limitless.Exchange</a> · By FJ | @FJnikoo</p>
  </div>

    function $(id) { return document.getElementById(id); }

    function showScreen(id) {
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      $(id).classList.add('active');
    }

    function cleanHandle(raw) {
      let h = (raw || '').trim().replace(/^@/, '');
      h = h.replace(/[^a-zA-Z0-9_]/g, '');
      return h;
    }

    function shuffle(arr) {
      const a = [...arr];
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    // ========== ENTRY ==========
    const avatarInput = $('avatarInput');
    const handleInput = $('handleInput');
    const startBtn = $('startBtn');

    avatarInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (ev) => {
        state.avatarDataUrl = ev.target.result;
        $('avatarPreview').src = state.avatarDataUrl;
        $('avatarPreview').style.display = 'block';
        $('avatarPlaceholder').style.display = 'none';
        checkReady();
      };
      reader.readAsDataURL(file);
    });

    const nameInput = $('nameInput');

    handleInput.addEventListener('input', () => {
      // Auto-fill display name from handle if user hasn't typed a custom name yet
      const h = cleanHandle(handleInput.value);
      if (!nameInput.dataset.touched) {
        nameInput.value = h;
      }
      checkReady();
    });

    nameInput.addEventListener('input', () => {
      nameInput.dataset.touched = '1';
      checkReady();
    });

    function checkReady() {
      const h = cleanHandle(handleInput.value);
      const n = (nameInput.value || '').trim();
      startBtn.disabled = !(state.avatarDataUrl && h.length >= 2 && n.length >= 1);
    }

    startBtn.addEventListener('click', () => {
      state.handle = cleanHandle(handleInput.value);
      state.displayName = (nameInput.value || state.handle).trim() || state.handle;
      state.score = 0;
      state.streak = 0;
      state.maxStreak = 0;
      state.round = 0;
      state.questions = shuffle(BANK).slice(0, 5);
      showScreen('game');
      nextRound();
    });

    // ========== GAME ==========
    function nextRound() {
      if (state.round >= state.questions.length) {
        finishGame();
        return;
      }
      state.answered = false;
      state.timeLeft = 12;
      $('roundNum').textContent = state.round + 1;
      $('scoreNum').textContent = state.score;
      $('feedback').textContent = '';
      $('timerFill').style.width = '100%';
      $('timerFill').classList.remove('urgent');

      const q = state.questions[state.round];
      const side = q.ask === 'left' ? q.left : q.right;
      const other = q.ask === 'left' ? q.right : q.left;

      // Market UI
      $('marketCard').innerHTML = `
        <div class="market-title">${q.title}</div>
        <div class="sides">
          <div class="side left">
            <div class="side-name">${q.left.name}</div>
            <div class="side-meta">${q.left.pct}% · ${q.left.x.toFixed(2)}x</div>
          </div>
          <div class="vs">VS</div>
          <div class="side right">
            <div class="side-name">${q.right.name}</div>
            <div class="side-meta">${q.right.x.toFixed(2)}x · ${q.right.pct}%</div>
          </div>
        </div>
        <div class="prob-bar"><div class="left-fill" style="width:${q.left.pct}%"></div></div>
      `;

      $('questionText').innerHTML = `If you put <em>$1</em> on <em>${side.name}</em> and win, how much do you get back?`;

      // Options: correct + 2 distractors
      const correct = side.x;
      let distractors = [
        other.x,
        +(1 / (side.pct / 100)).toFixed(2), // raw 1/p
        +(correct * 0.85).toFixed(2),
        +(correct * 1.15).toFixed(2),
        +(side.pct / 100 + 1).toFixed(2),
      ].filter(v => Math.abs(v - correct) > 0.08);
      distractors = [...new Set(distractors.map(v => +v.toFixed(2)))];
      const opts = shuffle([correct, ...distractors]).slice(0, 3);
      // ensure correct is in
      if (!opts.includes(correct)) opts[0] = correct;
      const finalOpts = shuffle(opts);

      const optionsEl = $('options');
      optionsEl.innerHTML = '';
      finalOpts.forEach(val => {
        const btn = document.createElement('button');
        btn.className = 'option';
        btn.textContent = '$' + val.toFixed(2);
        btn.dataset.value = val;
        btn.onclick = () => answer(val, correct, btn);
        optionsEl.appendChild(btn);
      });

      startTimer();
    }

    function startTimer() {
      clearInterval(state.timer);
      const total = 12;
      state.timeLeft = total;
      state.timer = setInterval(() => {
        state.timeLeft -= 0.1;
        const pct = Math.max(0, (state.timeLeft / total) * 100);
        $('timerFill').style.width = pct + '%';
        if (state.timeLeft <= 4) $('timerFill').classList.add('urgent');
        if (state.timeLeft <= 0) {
          clearInterval(state.timer);
          if (!state.answered) timeUp();
        }
      }, 100);
    }

    function answer(chosen, correct, btn) {
      if (state.answered) return;
      state.answered = true;
      clearInterval(state.timer);

      document.querySelectorAll('.option').forEach(b => {
        b.disabled = true;
        const v = +b.dataset.value;
        if (Math.abs(v - correct) < 0.001) b.classList.add('correct');
        else if (b === btn) b.classList.add('wrong');
      });

      if (Math.abs(chosen - correct) < 0.001) {
        state.score++;
        state.streak++;
        state.maxStreak = Math.max(state.maxStreak, state.streak);
        $('scoreNum').textContent = state.score;
        $('feedback').innerHTML = `<strong>Correct!</strong> The <em>x</em> on Limitless is the amount you get back for $1 if you win.`;
      } else {
        state.streak = 0;
        $('feedback').innerHTML = `Wrong. Correct answer was <strong>$${correct.toFixed(2)}</strong>. That is the payout multiplier shown on Limitless.`;
      }

      setTimeout(() => {
        state.round++;
        nextRound();
      }, 1800);
    }

    function timeUp() {
      state.answered = true;
      state.streak = 0;
      const q = state.questions[state.round];
      const side = q.ask === 'left' ? q.left : q.right;
      document.querySelectorAll('.option').forEach(b => {
        b.disabled = true;
        if (Math.abs(+b.dataset.value - side.x) < 0.001) b.classList.add('correct');
      });
      $('feedback').innerHTML = `Time's up. Correct was <strong>$${side.x.toFixed(2)}</strong>.`;
      setTimeout(() => {
        state.round++;
        nextRound();
      }, 1600);
    }

    // ========== RESULT + CARD ==========
    async function finishGame() {
      $('overlay').classList.add('show');
      showScreen('result');
      await drawCard();
      $('overlay').classList.remove('show');
    }

    function getRank() {
      if (state.score >= 5) return 'PAYOUT MASTER';
      if (state.score >= 4) return 'MARKET WHISPERER';
      if (state.score >= 3) return 'ODDS READER';
      if (state.score >= 2) return 'APPRENTICE';
      return 'ROOKIE';
    }

    function drawCard() {
      return new Promise((resolve) => {
        const canvas = $('cardCanvas');
        const ctx = canvas.getContext('2d');
        const W = 1200, H = 675;
        canvas.width = W;
        canvas.height = H;

        // Background
        ctx.fillStyle = '#05070a';
        ctx.fillRect(0, 0, W, H);

        // Soft radial glow behind center
        const grad = ctx.createRadialGradient(W/2, H*0.42, 30, W/2, H*0.42, 380);
        grad.addColorStop(0, 'rgba(200,255,0,0.14)');
        grad.addColorStop(1, 'rgba(200,255,0,0)');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, W, H);

        // Draw official logo image (lime square with black mark)
        function drawLogoImg(x, y, size, alpha) {
          if (!state.logoImg) return;
          ctx.save();
          ctx.globalAlpha = alpha;
          // rounded square clip for soft look on bg logos
          const r = size * 0.18;
          ctx.beginPath();
          ctx.moveTo(x + r, y);
          ctx.arcTo(x + size, y, x + size, y + size, r);
          ctx.arcTo(x + size, y + size, x, y + size, r);
          ctx.arcTo(x, y + size, x, y, r);
          ctx.arcTo(x, y, x + size, y, r);
          ctx.closePath();
          ctx.clip();
          ctx.drawImage(state.logoImg, x, y, size, size);
          ctx.restore();
        }

        // Sparse background logos
        const positions = [
          [48, 48, 44, 0.22], [1108, 52, 40, 0.18],
          [70, 540, 36, 0.16], [1090, 560, 38, 0.16],
          [40, 300, 28, 0.10], [1130, 310, 28, 0.10],
          [220, 40, 24, 0.08], [960, 36, 24, 0.08],
          [200, 600, 26, 0.08], [980, 610, 26, 0.08],
        ];
        positions.forEach(([x, y, s, a]) => drawLogoImg(x, y, s, a));

        // Top center logo (clear) — ~30% larger
        drawLogoImg(W/2 - 29, 22, 58, 1);

        // Title — extra space under logo
        ctx.fillStyle = '#c8ff00';
        ctx.font = '900 48px Inter, system-ui, sans-serif';
        ctx.textAlign = 'center';
        ctx.shadowColor = 'rgba(200,255,0,0.4)';
        ctx.shadowBlur = 16;
        let title = (state.displayName.toUpperCase() + ' IS LIMITLESS NOW');
        // shrink font if name is long
        if (title.length > 28) ctx.font = '900 40px Inter, system-ui, sans-serif';
        if (title.length > 34) ctx.font = '900 34px Inter, system-ui, sans-serif';
        ctx.fillText(title, W/2, 148);
        ctx.shadowBlur = 0;

        // Avatar circle
        const cx = W/2, cy = 265, r = 72;
        ctx.beginPath();
        ctx.arc(cx, cy, r + 5, 0, Math.PI * 2);
        ctx.strokeStyle = '#c8ff00';
        ctx.lineWidth = 4;
        ctx.shadowColor = 'rgba(200,255,0,0.55)';
        ctx.shadowBlur = 18;
        ctx.stroke();
        ctx.shadowBlur = 0;

        function drawPlaceholderAvatar() {
          ctx.fillStyle = '#1a2330';
          ctx.beginPath();
          ctx.arc(cx, cy, r, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = '#c8ff00';
          ctx.beginPath();
          ctx.arc(cx, cy - 10, 24, 0, Math.PI * 2);
          ctx.fill();
          ctx.beginPath();
          ctx.ellipse(cx, cy + 40, 36, 26, 0, Math.PI, 0, true);
          ctx.fill();
        }

        function finishText() {
          // Name + handle
          ctx.fillStyle = '#c8ff00';
          ctx.font = '700 34px Inter, system-ui, sans-serif';
          ctx.textAlign = 'center';
          ctx.fillText(state.displayName, W/2, 380);

          ctx.fillStyle = '#9acc00';
          ctx.font = '500 20px Inter, system-ui, sans-serif';
          ctx.fillText('@' + state.handle, W/2, 410);

          // Divider
          ctx.strokeStyle = 'rgba(200,255,0,0.35)';
          ctx.lineWidth = 1;
          ctx.beginPath();
          ctx.moveTo(W/2 - 170, 435);
          ctx.lineTo(W/2 + 170, 435);
          ctx.stroke();
          ctx.beginPath();
          ctx.arc(W/2, 435, 3, 0, Math.PI * 2);
          ctx.fillStyle = '#c8ff00';
          ctx.fill();

          // Stats
          const rank = getRank();
          ctx.fillStyle = '#8b9bb0';
          ctx.font = '600 13px Inter, system-ui, sans-serif';
          ctx.fillText('RANK', W/2 - 180, 475);
          ctx.fillText('SCORE', W/2, 475);
          ctx.fillText('STREAK', W/2 + 180, 475);

          ctx.fillStyle = '#c8ff00';
          ctx.font = '800 20px Inter, system-ui, sans-serif';
          ctx.fillText(rank, W/2 - 180, 502);
          ctx.fillText(state.score + '/5', W/2, 502);
          ctx.fillText(String(state.maxStreak), W/2 + 180, 502);

          // Educational line
          ctx.fillStyle = '#8b9bb0';
          ctx.font = '500 15px Inter, system-ui, sans-serif';
          ctx.fillText('Price is probability. Winning share always pays $1.', W/2, 555);

          // Footer
          ctx.font = '500 14px Inter, system-ui, sans-serif';
          ctx.textAlign = 'left';
          ctx.fillStyle = '#6b7a8d';
          ctx.fillText('limitless.exchange', 48, 630);
          ctx.textAlign = 'right';
          ctx.fillText('By FJ | @FJnikoo', W - 48, 630);
        }

        // Clip + draw avatar
        ctx.save();
        ctx.beginPath();
        ctx.arc(cx, cy, r, 0, Math.PI * 2);
        ctx.clip();
        if (state.avatarDataUrl) {
          const img = new Image();
          img.onload = () => {
            const scale = Math.max((r * 2) / img.width, (r * 2) / img.height);
            const iw = img.width * scale;
            const ih = img.height * scale;
            ctx.drawImage(img, cx - iw / 2, cy - ih / 2, iw, ih);
            ctx.restore();
            finishText();
            resolve();
          };
          img.onerror = () => {
            drawPlaceholderAvatar();
            ctx.restore();
            finishText();
            resolve();
          };
          img.src = state.avatarDataUrl;
        } else {
          drawPlaceholderAvatar();
          ctx.restore();
          finishText();
          resolve();
        }
      });
    }

    $('downloadBtn').addEventListener('click', () => {
      const canvas = $('cardCanvas');
      const link = document.createElement('a');
      link.download = state.handle + '-limitless.png';
      link.href = canvas.toDataURL('image/png');
      link.click();
    });

    $('shareBtn').addEventListener('click', () => {
      const name = state.displayName;
      const score = state.score;
      const rank = getRank();
      // Game link – replace with real Vercel URL later
      const gameUrl = window.location.href.split('?')[0];

      const text =
`${name} is Limitless now ⚡

Just scored ${score}/5 as ${rank} on the Limitless Payout Master. @trylimitless

Price is probability. Winning share always pays $1.

Think you can beat me? Try it yourself:
${gameUrl}`;

      const intent = 'https://twitter.com/intent/tweet?text=' + encodeURIComponent(text);
      window.open(intent, '_blank', 'noopener');
    });

    $('replayBtn').addEventListener('click', () => {
      // keep avatar + handle, reset game
      state.score = 0;
      state.streak = 0;
      state.maxStreak = 0;
      state.round = 0;
      state.questions = shuffle(BANK).slice(0, 5);
      showScreen('game');
      nextRound();
    });
  </script>
</body>
</html>
